<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .bg-black {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <table style="width: 100%; height: 100%">
      
      <!-- Row 1: Table 1 and Table 2 -->
      <tr>
        <!-- Top Left: Nested Table 1 -->
        <td>
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Nested Table 1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <ul>
                                <li>List item 1</li>
                                <li>List item 2</li>
                                <li>List item 3</li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>

        <!-- Top Right: Nested Table 2 -->
        <td>
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Row 1 Col 1</td>
                        <td>Row 1 Col 2</td>
                    </tr>
                </tbody>
            </table>
        </td>
      </tr>

      <!-- Row 2: Table 3 and Table 4 -->
      <tr>
        <!-- Bottom Left: Nested Table 3 -->
        <td>
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="bg-black">HTML</td>
                        <td>CSS</td>
                    </tr>
                </tbody>
            </table>
        </td>

        <!-- Bottom Right: Nested Table 4 -->
        <td>
            <table>
                <thead>
                    <tr>
                        <th colspan="3">Nested Table 4</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Cell A</td>
                        <td>Cell B</td>
                        <td>Cell C</td>
                    </tr>
                </tbody>
            </table>
        </td>
      </tr>

    </table>
  </body>
</html>
